[project]
name = "referee-backend"
version = "0.1.1"
description = "Django backend for a referee registration system."
readme = "README.md"
license = {text ="GPLv3" }
authors = [
    { name = "Florian Koch", email = "flkoch@dev.fkoch.ch" },
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "django>=5.2",
    "django-celery-beat>=2.8.0",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.7.0",
    "django-environ>=0.12.0",
    "djangorestframework-simplejwt>=5.5.0",
    "flower>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "redis>=8.1.0",
]
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["B", "E", "F", "I", "DJ", "UP", "RUF"]
ignore = ["RUF012"]
fixable = ["ALL"]
isort.force-single-line = true
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs~=5.2",
    "pre-commit>=4.2.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
