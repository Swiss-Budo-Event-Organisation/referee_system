name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.13"
          enable-cache: true
      - name: Run all hooks
        working-directory: ./backend
        run: uv run pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the version in the Docker images; Django 6.0 supports
        # 3.12 to 3.14, and the project requires at least 3.13.
        python-version: ["3.13", "3.14"]
        experimental: [false]
        include:
          # Not yet supported by Django 6.0; a failure here doesn't fail CI.
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --locked
      - name: Run tests
        # manage.py test uses ref_sys.settings.test (SQLite, no services).
        working-directory: ./backend
        run: uv run manage.py test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major version as the frontend Docker images.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type check and build
        run: npm run build

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production images
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.production.yml build
